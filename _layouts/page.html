<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link href="{{ "/images/logo-ics.ico" | relative_url }}" rel="shortcut icon" type="image/vnd.microsoft.icon" />
    <style>
        body {
            text-align: center;
            line-height: 1.5em;
            background-size: 100%;
            background-color: #e0dedf;
            padding: 0;
            margin: 0;
            font-family: arial, helvetica, sans-serif;
            background-color: #824FA8;
        }

        #widther {
            margin: 0 auto;
            max-width: 1000px;
            text-align: left;
            box-shadow: 0pt 0pt 3px rgb(136, 136, 136);
            background-color: white;
        }

        h2, h3, h4 {
            color: #555555;
            font-family: Arial, sans-serif;
        }

        h2 > a {
            font-weight: normal;
        }

        h2 > sup {
            float: right;
        }

        #title {
            font-size: 32px;
            font-weight: bold;
            color: blue;
            font-family: 'Palatino', sans-serif;
            margin-left: 50px;
        }

        h1 {
            color: #333333;
            font-family: arial black, avant garde, sans-serif;
        }

        h4 {
            font-weight: bold;
        }

        p, li, td, th, a, .caption {
            font-family: arial, helvetica, sans-serif;
            color: #333333;
        }

        a {
            text-decoration: none;
            text-align: center;
            color: #095197;
        }

        a:hover {
            text-decoration: underline;
        }

        ul {
            line-height: 2em;
        }

        li > ul > li {
            font-size: smaller;
        }

        #header {
            display: grid;
            grid-template-columns: 150px 1fr;
            height: 100px;
        }

        #innerheader {
            display: grid;
            grid-template-rows: 50px 100px;
        }

        #body-grid {
            display : grid;
            grid-template-columns: 200px 1fr;
        }

        #container-content {
            padding: 0 20px 0 20px;
            overflow: hidden;
        }

        #container-content img { max-width: 100%; height: auto; }
        #container-content figure { margin: 1em 0; }
        #container-content table { display: block; max-width: 100%; overflow-x: auto; }
        #container-content td, #container-content th { padding: 6px; vertical-align: top; }
        #container-content a { overflow-wrap: anywhere; }
        .post-meta, .source-credit { font-size: smaller; color: #555; }
        .source-credit { margin: 2em 0; }
        .issue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 20px; }
        .issue-grid figure { text-align: center; }
        .issue-grid img { width: 120px; }
        .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 24px; align-items: start; }
        .home-content { min-width: 0; }
        .recent-posts { margin-top: 10px; padding: 0 14px 14px; font-size: 0.85em; background: #f5f3f6; border-top: 3px solid #824FA8; }
        .recent-posts h2 { font-size: 1.2em; }
        .recent-posts ul { list-style: none; padding: 0; margin: 0; line-height: 1.4; }
        .recent-posts li + li { margin-top: 14px; }
        .recent-posts a { display: block; text-align: left; }
        .recent-posts time { display: block; margin-top: 4px; font-size: smaller; color: #666; }

        #sidebar {
        }

        footer {
            font-size: small;
            background: #333333;
            color:white;
            text-align: center;
            padding: 25px;
        }

        .person {
            font-size: smaller;
            text-align: center;
            height: 380px;
            width: 250px;
            margin: 50px;
            float:left;
        }

        .person > h4 {
            margin: 0;
            line-height: 1.5em;
        }

        .person > p {
            margin: 0;
            line-height: 1.5em;
        }

        .caption {
            font-size: small;
        }

        #subcomm-age {
            background-color: #824FA8;
            height: 10px;
            width: 100%;
            display: block;
        }
    .person { float: none; width: auto; height: auto; margin: 30px 0; text-align: left; }
    .person img { max-width: 150px; max-height: 180px; }
    @media (max-width: 700px) {
        #header { grid-template-columns: 90px 1fr; height: auto; }
        #header img { max-width: 80px; }
        #innerheader { display: block; }
        #headertxt { padding: 20px 10px !important; }
        #title { font-size: 24px; margin-left: 0; }
        #body-grid { display: block; }
        .home-grid { grid-template-columns: minmax(0, 1fr); }
    }
</style>

</head>
<body>
    <div id="widther">
        <div id="header">
            <div style="text-align:right;">
                <a href="http://stratigraphy.org"><img src="{{ "/images/logo-isc-3D-dark.png" | relative_url }}" alt="ICS logo" style="width:100px" /></a>
            </div>
            <div id="innerheader">
                <div id="headertxt" style="padding: 50px 20px;">
                    <div id="title">{{ site.title }}</div>
                </div>
            </div>
        </div>

        <div id="subcomm-age" aria-hidden="true"></div>
        <div id="body-grid">
            <div id="sidebar" style="grid-column: 1;">
                {% include menu.html %}
            </div>
            <div id="container-content" style="grid-column: 2;">
                {{ content }}
            </div>
        </div>
        <footer>
            &copy; 2013-{{ "now" | date: "%Y" }} International Commission on Stratigraphy, all rights reserved
        </footer>
    </div>
</body>
</html>
